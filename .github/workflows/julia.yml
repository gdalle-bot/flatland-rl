name: Julia

# CI for the Julia package in julia/Flatland (see REVAMP.md). Runs only when the Julia package, the Python scripts that
# export its conformance data, or this workflow change.
on:
    push:
        branches: [ "main" ]
        paths: [ "julia/**", "tests/conformance/**", ".github/workflows/julia.yml" ]
    pull_request:
        paths: [ "julia/**", "tests/conformance/**", ".github/workflows/julia.yml" ]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
    test:
        name: Test (Julia ${{ matrix.version }}, ${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        # the prerelease is tested to see problems early, without blocking
        continue-on-error: ${{ matrix.version == 'pre' }}
        permissions:
            # julia-actions/cache deletes the old caches it created
            actions: write
            contents: read
        strategy:
            fail-fast: false
            matrix:
                version: [ "lts", "1", "pre" ]
                os: [ ubuntu-24.04 ]
                include:
                    -   version: "1"
                        os: macos-latest
                    -   version: "1"
                        os: windows-latest
        steps:
            -   uses: actions/checkout@v7
            -   uses: julia-actions/setup-julia@v3
                with:
                    version: ${{ matrix.version }}
            -   uses: julia-actions/cache@v3
            -   uses: julia-actions/julia-buildpkg@v1
                with:
                    project: julia/Flatland
            -   uses: julia-actions/julia-runtest@v1
                with:
                    project: julia/Flatland
            -   uses: julia-actions/julia-processcoverage@v1
                with:
                    directories: julia/Flatland/src
            -   uses: codecov/codecov-action@v7
                with:
                    files: lcov.info
                    flags: julia
                    token: ${{ secrets.CODECOV_TOKEN }}
                    fail_ci_if_error: false

    downgrade:
        name: Test with lowest compatible dependencies
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        permissions:
            actions: write
            contents: read
        steps:
            -   uses: actions/checkout@v7
            -   uses: julia-actions/setup-julia@v3
                with:
                    version: lts
            -   uses: julia-actions/julia-downgrade-compat@v2
                with:
                    projects: julia/Flatland
            -   uses: julia-actions/julia-buildpkg@v1
                with:
                    project: julia/Flatland
            -   uses: julia-actions/julia-runtest@v1
                with:
                    project: julia/Flatland

    format:
        name: Format (Runic)
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        permissions:
            actions: write
            contents: read
        steps:
            -   uses: actions/checkout@v7
            -   uses: julia-actions/setup-julia@v3
                with:
                    version: "1"
            -   uses: julia-actions/cache@v3
            -   name: Install Runic
                run: julia --project=@runic --color=yes -e 'using Pkg; Pkg.add("Runic")'
            -   name: Check formatting
                run: julia --project=@runic --color=yes -e 'using Runic; exit(Runic.main(["--check", "--diff", "julia"]))'

    docs:
        name: Documentation
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        permissions:
            actions: write
            contents: write
            statuses: write
        steps:
            -   uses: actions/checkout@v7
            -   uses: julia-actions/setup-julia@v3
                with:
                    version: "1"
            -   uses: julia-actions/cache@v3
            -   name: Install dependencies
                run: julia --project=julia/Flatland/docs --color=yes -e 'using Pkg; Pkg.develop(PackageSpec(path="julia/Flatland")); Pkg.instantiate()'
            -   name: Build and deploy
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: julia --project=julia/Flatland/docs --color=yes julia/Flatland/docs/make.jl
