name: Conformance data

# Checks that the conformance data of the Julia package (julia/Flatland/test/data) is what the Python package exports
# today, so that a change of the Python semantics cannot leave the Julia tests comparing against stale data.
on:
    push:
        branches: [ "main" ]
        paths: [ "flatland/**", "tests/conformance/**", "julia/Flatland/test/data/**", "requirements.txt", ".github/workflows/conformance.yml" ]
    pull_request:
        paths: [ "flatland/**", "tests/conformance/**", "julia/Flatland/test/data/**", "requirements.txt", ".github/workflows/conformance.yml" ]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
    contents: read

jobs:
    export:
        name: Exported data is up to date
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            -   uses: actions/checkout@v7
            -   uses: actions/setup-python@v6
                with:
                    python-version: "3.13"
            -   name: Install the Python dependencies
                run: python -m pip install -r requirements.txt
            -   name: Export the topology
                env:
                    PYTHONPATH: ${{ github.workspace }}
                    MPLBACKEND: Agg
                run: python tests/conformance/export_topology.py julia/Flatland/test/data/topology.json
            -   name: Export the collect phase's candidates
                env:
                    PYTHONPATH: ${{ github.workspace }}
                    MPLBACKEND: Agg
                run: python tests/conformance/export_candidates.py julia/Flatland/test/data/candidates.json
            -   name: Compare with the committed data
                run: git diff --exit-code --stat julia/Flatland/test/data
